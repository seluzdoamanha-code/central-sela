<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pessoas - SELA Mobile</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="m_style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth_guard.js"></script>
    
    <!-- Meta tags nativas -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo_sela.png">
    <link rel="icon" type="image/png" href="logo_sela.png">

    <style>
        .m-search-box {
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            padding-top: 8px;
            padding-bottom: 16px;
            z-index: 10;
        }
        .m-search-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-panel);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }
        .m-search-input:focus {
            border-color: var(--primary);
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    
    <header class="m-header">
        <div class="m-header-title">Gestão de Pessoas</div>
        <button class="m-header-action" onclick="alert('Funcionalidade de cadastro em breve no mobile!')">+</button>
    </header>

    <main class="m-viewport">
        <div class="m-screen" id="screen-pessoas">
            
            <div class="m-search-box">
                <div style="position: relative;">
                    <input type="text" id="mSearchInput" class="m-search-input" placeholder="Buscar pessoa ou empresa..." style="padding-right: 48px;">
                    <button id="btnToggleFilter" style="position: absolute; right: 8px; top: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                    </button>
                </div>
                
                <div id="mFilterPanel" style="display: none; padding-top: 12px; gap: 8px; flex-direction: column;">
                    <div style="display: flex; gap: 8px;">
                        <select id="mFilterTipo" class="m-search-input" style="padding: 10px; font-size: 14px; flex: 1;">
                            <option value="">Todos os Tipos</option>
                            <option value="Física">Pessoa Física</option>
                            <option value="Jurídica">Pessoa Jurídica</option>
                        </select>
                        <select id="mSortOrder" class="m-search-input" style="padding: 10px; font-size: 14px; flex: 1;">
                            <option value="nome_az">A - Z</option>
                            <option value="nome_za">Z - A</option>
                            <option value="recentes">Recentes</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="mLoadingState" style="text-align: center; color: var(--text-muted); padding: 40px; font-size: 14px;">
                Carregando lista...
            </div>
            
            <div id="mListPessoas">
                <!-- Cards de pessoas serão injetados aqui -->
            </div>
            
        </div>
    </main>

    <nav class="m-bottom-nav">
        <a href="m_index.html" class="m-nav-item">
            <span class="m-nav-icon">🏠</span>
            <span class="m-nav-label">Início</span>
        </a>
        <a href="m_entidade.html" class="m-nav-item">
            <span class="m-nav-icon">🏛️</span>
            <span class="m-nav-label">Entidade</span>
        </a>
        <a href="m_pessoas.html" class="m-nav-item active">
            <span class="m-nav-icon">👥</span>
            <span class="m-nav-label">Pessoas</span>
        </a>
        <a href="m_config.html" class="m-nav-item">
            <span class="m-nav-icon">⚙️</span>
            <span class="m-nav-label">Config.</span>
        </a>
    </nav>

    <script src="m_pessoas.js"></script>
</body>
</html>
